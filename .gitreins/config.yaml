# GitReins Configuration — Inference Cluster Estimator
# Static HTML/JS project — no Go build, guard is secrets + HTML lint only

guards:
  go_tests:
    enabled: false
  go_lint:
    enabled: false
  go_build:
    enabled: false
  gofmt:
    enabled: false
  secrets:
    enabled: true
  # No JS lint setup in this static HTML/JS project — eslint is not a
  # devDependency and ESLint 10.x requires a flat eslint.config.* file the
  # repo does not carry. The judge's tier1 `npx eslint .` therefore exits 2
  # ("couldn't find an eslint.config.* file") on every verdict since
  # IE-GAP-041 while tier2 criteria PASS — env-dependent lint noise (npx
  # fetches eslint from cache/registry), not a real finding (RR-GAP-040 /
  # off-by-one answer 1286 precedent; INT-CI-001). Re-enable if a real
  # ESLint flat-config setup lands.
  lint: false
  # No test framework in this static HTML/JS project — pytest exits 5
  # ("no tests ran") which the guard treats as FAIL and blocks every
  # staged commit (proven tick #20 2026-08-02). Tests gate = N/A per
  # never-done audit. Re-enable if a real test suite lands.
  tests: false

defaults:
  model: deepseek-v4-flash
  api_key_env: GITREINS_LLM_API_KEY

evaluator:
  model: deepseek-v4-flash
  max_iterations: 200
  max_time: 25m
  max_input_tokens: 4M
  max_output_tokens: 100k
  file_scope: changed
  static_analysis_diagnostics: true

tasks:
  source: coding-hermes
  path: .coding-hermes/tasks.md
