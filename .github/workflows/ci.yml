name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (jsdom + Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fresh runners have no browsers cached — install Chromium + system deps
      # for the real-browser smoke suite (test-browser.js).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests (node test.js && node test-browser.js)
        run: npm test
